name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 前端：pnpm test + 双端 tsc
  frontend:
    name: Frontend (test + tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: i18n completeness
        run: node scripts/check-i18n.mjs
      - name: Test
        run: pnpm test
      - name: Coverage gate
        # 覆盖率 + vitest thresholds 门禁（shared 60 / ui 53 / design-system 46，
        # 目标见 docs/MASTER_PLAN.md 6.2）。@vitest/coverage-v8 尚未进 lockfile
        # （避免本地改动 pnpm-lock.yaml），CI 内临时补装；后续把该依赖正式
        # 提交为 workspace devDependency 后可删除此临时步骤。
        run: |
          pnpm add -w @vitest/coverage-v8@2.1.9
          LANG=C.UTF-8 pnpm test:coverage
      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: packages/*/coverage/
          retention-days: 7
      - name: Typecheck (web)
        run: cd apps/web && npx tsc --noEmit
      - name: Typecheck (desktop)
        run: cd apps/desktop && npx tsc --noEmit

  # E2E：Playwright smoke tests，在 mock 模式下运行（无需真实后端）
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install chromium --with-deps
      - name: Run E2E tests
        run: pnpm --filter @yuanchat/web test:e2e
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # 后端：go vet + go test（不依赖 postgres 的用例，集成测试自动 skip）
  backend:
    name: Backend (vet + test)
    runs-on: ubuntu-latest
    # 集成测试依赖 Postgres（testutil.NewDB 建独立测试库并跑 goose 迁移，
    # 需要可建库的角色；pg_trgm 扩展由迁移自建，需超级用户）。
    # 无 DB 时这些用例整体 skip，覆盖率会塌到 ~13% 被 40% 门禁拦下。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yuanchat
          POSTGRES_PASSWORD: yuanchat_dev
          POSTGRES_DB: postgres
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U yuanchat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: server/go.sum
      - name: Vet
        working-directory: server
        run: go vet ./...
      - name: Test
        working-directory: server
        run: go test ./... -coverprofile=coverage.out -covermode=atomic
      - name: Coverage gate
        # 后端覆盖率门禁（排除 cmd/ testutil/ database/）。
        # 目标 80%（docs/MASTER_PLAN.md 6.2），现状基线 42.8%，先钉 40%（基线 -2pt），
        # 补齐 handler/repository 测试后逐步上调（B7 re-raise 待办）。
        working-directory: server
        run: node ../scripts/check-coverage.mjs 40 coverage.out
      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: server/coverage.out
          retention-days: 7
      - name: Race (ws)
        working-directory: server
        run: go test -race ./internal/ws/
