name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 前端：pnpm test + 双端 tsc
  frontend:
    name: Frontend (test + tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Typecheck (web)
        run: cd apps/web && npx tsc --noEmit
      - name: Typecheck (desktop)
        run: cd apps/desktop && npx tsc --noEmit

  # 后端：go vet + go test（不依赖 postgres 的用例，集成测试自动 skip）
  backend:
    name: Backend (vet + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: server/go.sum
      - name: Vet
        working-directory: server
        run: go vet ./...
      - name: Test
        working-directory: server
        run: go test ./...
      - name: Race (ws)
        working-directory: server
        run: go test -race ./internal/ws/
