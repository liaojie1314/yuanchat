name: Release

on:
  push:
    tags:
      - "v*"
  # 允许手动补跑：Actions 页面选 workflow → Run workflow → 输入已有的 tag
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 tag（如 v0.1.0）"
        required: true
        type: string

# tag 触发工作流写权限用于上传附件到 Release
permissions:
  contents: write

jobs:
  # ============ Web 静态产物 ============
  web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build web
        # 若部署环境需要指向自定义 API/WS，请在此处或通过 secrets 注入 VITE_* 变量
        # Sentry source map upload 在 SENTRY_AUTH_TOKEN 存在时由 vite-plugin 自动完成
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT_WEB: ${{ secrets.SENTRY_PROJECT_WEB }}
        run: pnpm --filter @yuanchat/web build
      - name: Package
        env:
          REF_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          cd apps/web/dist
          tar czf "../../../yuanchat-web-${REF_NAME}.tar.gz" .
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          # workflow_dispatch 触发时 ref 是分支名（如 main），需显式指定 tag
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: yuanchat-web-*.tar.gz
          fail_on_unmatched_files: true

  # ============ Desktop（Tauri 三平台） ============
  desktop:
    name: Build Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
            args: ""
          - platform: windows
            os: windows-latest
            args: ""
          - platform: macos
            os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS 通用二进制需两个 target
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install Linux deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev

      - name: Install
        run: pnpm install --frozen-lockfile

      # macOS/Windows 签名：只有 secret 存在时才注入环境变量，
      # 避免空值让 tauri 误以为要签名（会去 security import 一个空 pfx）
      - name: Prepare signing env
        id: signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            echo "sign_macos=true" >> "$GITHUB_OUTPUT"
          else
            echo "sign_macos=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping macOS codesign (no APPLE_CERTIFICATE secret set)"
          fi
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "sign_tauri=true" >> "$GITHUB_OUTPUT"
          else
            echo "sign_tauri=false" >> "$GITHUB_OUTPUT"
          fi

      # updater 签名（minisign 自签，免费）与 OS 代码签名（需付费证书）相互独立：
      # 没有 Apple 证书时也必须注入 TAURI_SIGNING_PRIVATE_KEY，否则产不出
      # latest.json 的签名，自动更新会校验失败
      - name: Build Tauri app (OS-unsigned)
        if: steps.signing.outputs.sign_macos == 'false'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT_DESKTOP: ${{ secrets.SENTRY_PROJECT_DESKTOP }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build Tauri app (OS-signed)
        if: steps.signing.outputs.sign_macos == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT_DESKTOP: ${{ secrets.SENTRY_PROJECT_DESKTOP }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # ============ Android APK（自签 keystore） ============
  android:
    name: Build Android APK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          # 与 desktop job 分隔缓存空间：4 Android target 独立 key，
          # 避免 desktop 三平台 job 冲刷 Android target 缓存
          shared-key: android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 缓存 NDK（~1.2 GB）：命中率接近 100%，省 3-5 min 下载/解压
      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          key: ndk-27.0.12077973-${{ runner.os }}

      - name: Install Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: sdkmanager --install "ndk;27.0.12077973"

      # 缓存 Gradle 依赖 + wrapper：省首次 AGP/AndroidX 拉取 2-3 min
      # key 用 tauri.conf.json（决定 gen/android 结构），restore-keys 兜底
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('apps/desktop/src-tauri/tauri.conf.json') }}
          restore-keys: |
            gradle-android-

      # Android 交叉编译 host 端不需要 webkit2gtk/gtk3（那是桌面 Linux 才用），
      # 只留 libssl-dev + build-essential 满足 build.rs / cc-rs 需求
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev build-essential

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. See docs/RELEASE.md"
            exit 1
          fi
          # 用 python base64 更宽容：容忍换行/空格/padding 差异（keytool 生成的 pfx 里可能有）
          python3 - <<'PY' > "$RUNNER_TEMP/release.keystore"
          import base64, os, sys
          data = os.environ['KEYSTORE_B64']
          # 去除所有空白字符（换行/空格/tab）
          cleaned = ''.join(data.split())
          # 补齐 base64 padding
          missing = (-len(cleaned)) % 4
          cleaned += '=' * missing
          sys.stdout.buffer.write(base64.b64decode(cleaned))
          PY
          ls -la "$RUNNER_TEMP/release.keystore"
          # 用 keytool 验证 keystore 可读（早失败早暴露密码/别名问题）
          if command -v keytool >/dev/null 2>&1; then
            keytool -list -keystore "$RUNNER_TEMP/release.keystore" \
              -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
              -alias "${{ secrets.ANDROID_KEY_ALIAS }}" || {
              echo "::error::keystore 验证失败：可能是 base64 解码错误或密码/别名不匹配"
              exit 1
            }
          fi
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Init Tauri Android
        working-directory: apps/desktop
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: pnpm tauri android init

      - name: Configure signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # 生成 keystore.properties + 注入 signingConfigs 到 build.gradle.kts
        run: |
          GEN_DIR=apps/desktop/src-tauri/gen/android
          APP_GRADLE="$GEN_DIR/app/build.gradle.kts"

          # 1. 生成 keystore.properties（rootProject 目录 = gen/android）
          cat > "$GEN_DIR/keystore.properties" <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$KEYSTORE_PATH
          EOF
          echo "--- keystore.properties (脱敏) ---"
          sed -e 's/=.*/=***/' "$GEN_DIR/keystore.properties"

          # 2. 修改 build.gradle.kts：加 import + signingConfigs 块 + release 引用签名
          python3 <<PY
          import re
          path = "$APP_GRADLE"
          src = open(path).read()

          # 幂等：已注入过则跳过（workflow 重跑保护）
          if 'yuanchat_signing_injected' in src:
              print("Already injected, skipping")
              raise SystemExit

          # a) 顶部加 import（放在首个 plugins/import 之前）
          if 'import java.util.Properties' not in src:
              src = 'import java.util.Properties\n\n' + src

          # b) 在 android { ... } 内 buildTypes 之前插入 signingConfigs
          inject = '''
              // yuanchat_signing_injected
              signingConfigs {
                  create("release") {
                      val kp = Properties()
                      val kpf = rootProject.file("keystore.properties")
                      if (kpf.exists()) kp.load(kpf.inputStream())
                      storeFile = file(kp.getProperty("storeFile"))
                      storePassword = kp.getProperty("storePassword")
                      keyAlias = kp.getProperty("keyAlias")
                      keyPassword = kp.getProperty("keyPassword")
                  }
              }
          '''
          new_src, count = re.subn(
              r'(\n\s*buildTypes\s*\{)', inject + r'\1', src, count=1
          )
          if count == 0:
              print("::error::Failed to locate buildTypes block")
              print(src[:2000])
              raise SystemExit(1)
          src = new_src

          # c) release 块内加 signingConfig 引用
          src = re.sub(
              r'(getByName\("release"\)\s*\{)',
              r'\1\n            signingConfig = signingConfigs.getByName("release")',
              src, count=1
          )
          open(path, 'w').write(src)
          print("--- build.gradle.kts 修改后前 80 行 ---")
          print('\n'.join(src.splitlines()[:80]))
          PY

      - name: Build APK
        working-directory: apps/desktop
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: pnpm tauri android build --apk --split-per-abi

      - name: Locate & rename APKs
        env:
          REF_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          mkdir -p artifacts
          find apps/desktop/src-tauri/gen/android/app/build/outputs -name "*-release.apk" | while read apk; do
            base=$(basename "$apk" .apk)
            cp "$apk" "artifacts/yuanchat-${REF_NAME}-${base}.apk"
          done
          ls -la artifacts

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: artifacts/*.apk
          fail_on_unmatched_files: true
