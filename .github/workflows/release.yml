name: Release

on:
  push:
    tags:
      - "v*"

# tag 触发工作流写权限用于上传附件到 Release
permissions:
  contents: write

jobs:
  # ============ Web 静态产物 ============
  web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build web
        # 若部署环境需要指向自定义 API/WS，请在此处或通过 secrets 注入 VITE_* 变量
        run: pnpm --filter @yuanchat/web build
      - name: Package
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          cd apps/web/dist
          tar czf "../../../yuanchat-web-${REF_NAME}.tar.gz" .
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: yuanchat-web-*.tar.gz
          fail_on_unmatched_files: true

  # ============ Desktop（Tauri 三平台） ============
  desktop:
    name: Build Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
            args: ""
          - platform: windows
            os: windows-latest
            args: ""
          - platform: macos
            os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS 通用二进制需两个 target
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install Linux deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS 签名（secrets 存在时才启用）
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows 签名（未来买证书时补 secret）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # ============ Android APK（自签 keystore） ============
  android:
    name: Build Android APK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libssl-dev \
            build-essential

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. See docs/RELEASE.md"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Init Tauri Android
        working-directory: apps/desktop
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: pnpm tauri android init

      - name: Configure signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # 生成 keystore.properties + 修改 build.gradle.kts 引用签名配置
        run: |
          GEN_DIR=apps/desktop/src-tauri/gen/android
          cat > "$GEN_DIR/keystore.properties" <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$KEYSTORE_PATH
          EOF

          # 注入 signingConfigs 与 buildTypes.release.signingConfig
          APP_GRADLE="$GEN_DIR/app/build.gradle.kts"
          python3 <<'PY'
          import re, os
          path = os.environ['APP_GRADLE'] if 'APP_GRADLE' in os.environ else 'apps/desktop/src-tauri/gen/android/app/build.gradle.kts'
          # 上面 env 未导出，直接写死路径
          path = 'apps/desktop/src-tauri/gen/android/app/build.gradle.kts'
          src = open(path).read()
          inject = '''
              signingConfigs {
                  create("release") {
                      val kp = java.util.Properties()
                      val kpf = rootProject.file("keystore.properties")
                      if (kpf.exists()) kp.load(kpf.inputStream())
                      storeFile = file(kp.getProperty("storeFile"))
                      storePassword = kp.getProperty("storePassword")
                      keyAlias = kp.getProperty("keyAlias")
                      keyPassword = kp.getProperty("keyPassword")
                  }
              }
          '''
          # 在 buildTypes 之前插入 signingConfigs
          if 'signingConfigs {' not in src:
              src = re.sub(r'(\n\s*buildTypes\s*\{)', inject + r'\1', src, count=1)
          # release 块加 signingConfig
          src = re.sub(
              r'(getByName\("release"\)\s*\{)',
              r'\1\n            signingConfig = signingConfigs.getByName("release")',
              src, count=1
          )
          open(path, 'w').write(src)
          PY

      - name: Build APK
        working-directory: apps/desktop
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: pnpm tauri android build --apk --split-per-abi

      - name: Locate & rename APKs
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p artifacts
          find apps/desktop/src-tauri/gen/android/app/build/outputs -name "*-release.apk" | while read apk; do
            base=$(basename "$apk" .apk)
            cp "$apk" "artifacts/yuanchat-${REF_NAME}-${base}.apk"
          done
          ls -la artifacts

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          fail_on_unmatched_files: true
