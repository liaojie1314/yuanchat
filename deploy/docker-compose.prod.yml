# 元聊 YuanChat — 生产部署编排
#
# 用法（详见 docs/deploy/self-hosted.md）：
#   cp deploy/.env.prod.example deploy/.env && vim deploy/.env
#   ./deploy/install.sh
#
# 与开发用 docker-compose.yml 的区别：
# - 应用自身（server/web/admin）也容器化，不再本机 go run / vite dev
# - 前置 nginx 做 TLS 终止 + 五域名反代；数据库/Redis 不暴露公网端口，
#   MinIO 也不映射端口，但客户端要下载对象，故经 nginx 的存储子域反代对外
# - 全部凭据来自 .env，无硬编码默认密码

name: yuanchat

services:
  postgres:
    image: postgres:16-alpine
    container_name: yuanchat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # 仅内网可达：不映射宿主机端口
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [yuanchat-net]

  redis:
    image: redis:7-alpine
    container_name: yuanchat-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [yuanchat-net]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: yuanchat-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      # 预签名 URL 里的 host 必须是客户端可达的公网地址，且要与 nginx 上
      # 存储子域的 server_name 完全一致 —— SigV4 签名覆盖 Host 头，不一致会签名校验失败
      MINIO_SERVER_URL: https://${DOMAIN_STORAGE}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [yuanchat-net]

  # 迁移作为一次性任务先跑，成功后再起 server
  migrate:
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        VERSION: ${APP_VERSION:?APP_VERSION required (explicit release tag, no latest)}
    image: yuanchat/server:${APP_VERSION:?APP_VERSION required (explicit release tag, no latest)}
    container_name: yuanchat-migrate
    restart: "no"
    entrypoint: ["/app/migrate", "up"]
    environment: &server_env
      YUANCHAT_SERVER_ENV: production
      YUANCHAT_SERVER_PORT: "8085"
      YUANCHAT_WEBSOCKET_PORT: "8086"
      YUANCHAT_DATABASE_HOST: postgres
      YUANCHAT_DATABASE_PORT: "5432"
      YUANCHAT_DATABASE_USER: ${DB_USER}
      YUANCHAT_DATABASE_PASSWORD: ${DB_PASSWORD}
      YUANCHAT_DATABASE_DBNAME: ${DB_NAME}
      YUANCHAT_REDIS_HOST: redis
      YUANCHAT_REDIS_PORT: "6379"
      YUANCHAT_REDIS_PASSWORD: ${REDIS_PASSWORD}
      YUANCHAT_JWT_SECRET: ${JWT_SECRET}
      YUANCHAT_MINIO_ENDPOINT: minio:9000
      YUANCHAT_MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      YUANCHAT_MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      # 下发给客户端的对外地址：ENDPOINT 是 compose 内网主机名，浏览器/手机解析不了。
      # 必须与 minio 的 MINIO_SERVER_URL、nginx 存储子域三者一致
      YUANCHAT_MINIO_PUBLIC_ENDPOINT: ${DOMAIN_STORAGE}
      YUANCHAT_MINIO_PUBLIC_USE_SSL: "true"
      YUANCHAT_LOG_FORMAT: json
      YUANCHAT_LOG_OUTPUT: stdout
      YUANCHAT_PRESENCE_BACKEND: ${PRESENCE_BACKEND:-local}
      YUANCHAT_PUSH_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      YUANCHAT_PUSH_VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      YUANCHAT_PUSH_SUBJECT: mailto:${ADMIN_EMAIL}
      # TURN：与 coturn 容器共用同一套取值，任一项不一致都会让通话在 NAT 后打不通。
      # SECRET/REALM 两边同源（install.sh 用同样的 TURN_SECRET / DOMAIN_APP 渲染
      # coturn/turnserver.prod.conf），HOST 必须是客户端可达的公网域名 ——
      # 填 coturn 这个内网服务名浏览器解析不了（同 MINIO_PUBLIC_ENDPOINT 的道理）
      YUANCHAT_TURN_ENABLED: "true"
      YUANCHAT_TURN_HOST: ${DOMAIN_APP}
      YUANCHAT_TURN_PORT: "3478"
      YUANCHAT_TURN_REALM: ${DOMAIN_APP}
      YUANCHAT_TURN_STATIC_AUTH_SECRET: ${TURN_SECRET:?TURN_SECRET required (install.sh 会自动生成；手工部署请先填 deploy/.env)}
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [yuanchat-net]

  yuanchat-server:
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        VERSION: ${APP_VERSION:?APP_VERSION required (explicit release tag, no latest)}
    image: yuanchat/server:${APP_VERSION:?APP_VERSION required (explicit release tag, no latest)}
    container_name: yuanchat-server
    restart: unless-stopped
    environment: *server_env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [yuanchat-net]

  yuanchat-web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: https://${DOMAIN_API}
        VITE_WS_URL: wss://${DOMAIN_WS}
    image: yuanchat/web:${APP_VERSION:?APP_VERSION required (explicit release tag, no latest)}
    container_name: yuanchat-web
    restart: unless-stopped
    networks: [yuanchat-net]

  yuanchat-admin:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_BASE_URL: https://${DOMAIN_API}
    image: yuanchat/admin:${APP_VERSION:?APP_VERSION required (explicit release tag, no latest)}
    container_name: yuanchat-admin
    restart: unless-stopped
    networks: [yuanchat-net]

  nginx:
    image: nginx:1.27-alpine
    container_name: yuanchat-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # nginx.conf 由 install.sh 从 template envsubst 生成
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl-params.conf:/etc/nginx/ssl-params.conf:ro
      - ./nginx/proxy-params.conf:/etc/nginx/proxy-params.conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - yuanchat-server
      - yuanchat-web
      - yuanchat-admin
    networks: [yuanchat-net]

  # 证书续期：每 12h 检查一次，到期前 30 天自动续
  certbot:
    image: certbot/certbot:v5.7.0
    container_name: yuanchat-certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh
    command: -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
    networks: [yuanchat-net]

  # ---------- 可观测（可选，profile 启用）----------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: yuanchat-prometheus
    restart: unless-stopped
    profiles: [observability]
    volumes:
      - ./prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    networks: [yuanchat-net]

  grafana:
    image: grafana/grafana:10.2.0
    container_name: yuanchat-grafana
    restart: unless-stopped
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks: [yuanchat-net]

  loki:
    image: grafana/loki:3.1.0
    container_name: yuanchat-loki
    restart: unless-stopped
    profiles: [observability]
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    networks: [yuanchat-net]

  # WebRTC 中继。nginx 反代不了 UDP relay，因此 coturn 自己发布端口 ——
  # 这是除 80/443 之外唯一对外开放的一组端口。
  coturn:
    image: coturn/coturn:4.7.0
    container_name: yuanchat-coturn
    restart: unless-stopped
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    volumes:
      # turnserver.prod.conf 由 install.sh 从 .template envsubst 生成（含真实密钥，不入库）
      - ./coturn/turnserver.prod.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]
    networks: [yuanchat-net]

volumes:
  pg_data:
  redis_data:
  minio_data:
  certbot_conf:
  certbot_www:
  prom_data:
  grafana_data:
  loki_data:

networks:
  yuanchat-net:
    driver: bridge
