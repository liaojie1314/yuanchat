  #     - minio_data:/data
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #   networks:
  #     - yuanchat-net
  #   restart: unless-stopped

  # ==================== Elasticsearch (搜索 — 后续启用) ====================
  # elasticsearch:
  #   image: elasticsearch:8.15.0
