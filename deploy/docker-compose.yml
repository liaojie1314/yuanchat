version: "3.9"

services:
  # ==================== PostgreSQL ====================
  postgres:
    image: postgres:16-alpine
    container_name: yuanchat-postgres
    environment:
      POSTGRES_USER: yuanchat
      POSTGRES_PASSWORD: yuanchat_dev
      POSTGRES_DB: yuanchat
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d   # 初始化 SQL 脚本
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yuanchat -d yuanchat"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - yuanchat-net
    restart: unless-stopped

  # ==================== Redis ====================
  redis:
    image: redis:7-alpine
    container_name: yuanchat-redis
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yuanchat-net
    restart: unless-stopped

  # ==================== MinIO (文件存储) ====================
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: yuanchat-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: yuanchat_minio
      MINIO_ROOT_PASSWORD: yuanchat_minio_dev
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - yuanchat-net
    restart: unless-stopped

  # ==================== Elasticsearch (搜索 — 后续启用) ====================
  # elasticsearch:
  #   image: elasticsearch:8.15.0
  #   container_name: yuanchat-elasticsearch
  #   environment:
  #     - discovery.type=single-node
  #     - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
  #     - xpack.security.enabled=false
  #   ports:
  #     - "9200:9200"
  #   volumes:
  #     - es_data:/usr/share/elasticsearch/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'green\|yellow'"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #   networks:
  #     - yuanchat-net
  #   restart: unless-stopped

  # ==================== Prometheus ====================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: yuanchat-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - yuanchat-net
    restart: unless-stopped

  # ==================== Grafana ====================
  grafana:
    image: grafana/grafana:11.2.0
    container_name: yuanchat-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=yuanchat_dev
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - yuanchat-net
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  # es_data:

networks:
  yuanchat-net:
    driver: bridge
    name: yuanchat-net
    ipam:
      config:
        - subnet: 172.29.0.0/16
