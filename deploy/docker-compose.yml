volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  # minio_data:
  # es_data:

networks:
  yuanchat-net:
    driver: bridge
    name: yuanchat-net
    ipam:
      config:
        - subnet: 172.29.0.0/16
