version: "3.9"

services:
  # ==================== PostgreSQL ====================
  postgres:
    image: postgres:16-alpine
    container_name: yuanchat-postgres
    environment:
      POSTGRES_USER: yuanchat
      POSTGRES_PASSWORD: yuanchat_dev
      POSTGRES_DB: yuanchat
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d   # 初始化 SQL 脚本
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yuanchat -d yuanchat"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - yuanchat-net
    restart: unless-stopped

  # ==================== Redis ====================
  redis:
    image: redis:7-alpine
    container_name: yuanchat-redis
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yuanchat-net
    restart: unless-stopped

  # ==================== MinIO (文件存储 — 后续启用) ====================
