# 开发环境 TURN 配置（network_mode: host，直接绑宿主接口）。
#
# 与 turnserver.prod.conf 的唯一实质差异是【不禁私网 peer】：
# 开发时 Web / 桌面 / 安卓模拟器全都在 127.0.0.1 与局域网段，
# 禁掉私网等于把开发环境自己的中继路径整条封死。

listening-port=3478
fingerprint

# REST API 凭据模式：服务端用同一密钥签发 <expiry>:<uid> / HMAC-SHA1 凭据，
# coturn 自行复算校验，双方都不建 TURN 用户表。
use-auth-secret
static-auth-secret=yuanchat-dev-turn-secret
realm=yuanchat

# relay 端口段。开发只会有个位数并发通话，给窄一点便于排查。
min-port=49160
max-port=49200

no-multicast-peers
# coturn 4.5 起默认拒绝 loopback peer（表现为 create permission 403 Forbidden IP）。
# 开发环境两个浏览器 / 桌面端都在 127.0.0.1 上，不放行等于中继在本机永远不可用。
# 生产【绝不】开这一项 —— 它与 denied-peer-ip 的私网封禁是同一道防线的两面。
allow-loopback-peers
no-cli
log-file=stdout
verbose
