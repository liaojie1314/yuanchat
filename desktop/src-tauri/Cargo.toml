[package]
name = "yuanchat-desktop"
version = "0.1.0"
description = "元聊 YuanChat — 企业级即时通讯桌面端"
authors = ["元渊"]
license = "Proprietary"
repository = "https://github.com/liaojie1314/yuanchat"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
time = ">=0.3.35, <0.3.37"
