[package]
name = "yuanchat-desktop"
version = "0.1.0"
description = "元聊 YuanChat — 企业级即时通讯桌面端"
authors = ["元渊"]
license = "MIT"
repository = "https://github.com/liaojie1314/yuanchat"
edition = "2021"
rust-version = "1.77.2"
# 有了通话助手这第二个 bin 之后，`cargo run` / `tauri dev` 不再能自己判断该跑哪个，
# 必须显式指定主程序，否则两者都报 "could not determine which binary to run"
default-run = "yuanchat-desktop"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 通话媒体助手：必须是独立进程，不能是主程序里的线程。
# webrtcbin 拽进的 libsoup-2.4 与 WebKitGTK 的 libsoup-3.0 同进程必 abort，
# 且该检查无开关可关（详见 src/native_rtc.rs 文件头）。
# 仅 Linux 需要 —— Windows 的 WebView2 与 macOS 的 WKWebView 自带 WebRTC。
[[bin]]
name = "yuanchat-call-helper"
path = "src/bin/call_helper.rs"
required-features = []

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-os = "2"
time = ">=0.3.35, <0.3.37"

# 自动更新：updater 用 minisign 密钥对签名（自签免费，与 macOS/Windows
# OS 层代码签名相互独立）。移动端不支持 updater，故按 target 分组引入。
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# 条码扫描：仅移动端有摄像头与原生扫码实现，桌面端不编译进去。
[target."cfg(any(target_os = \"android\", target_os = \"ios\"))".dependencies]
tauri-plugin-barcode-scanner = "2"

# WebKitGTK 默认不给 media-stream，也不会弹授权框，语音消息要靠它开权限。
# 版本与 tauri 自身依赖的一致，保证拿到的是同一个 WebView 类型
[target."cfg(target_os = \"linux\")".dependencies]
webkit2gtk = { version = "2", features = ["v2_40"] }
# 通话媒体面所需。**只有 call_helper 那个独立进程会用到它们**：
# webrtcbin 会拽进 libnice → libgupnp-igd → libsoup-2.4，而 WebKitGTK 用的是
# libsoup-3.0，二者同进程必 abort（详见 src/native_rtc.rs 文件头）。
# 主程序这边只做进程间转发，不碰 GStreamer。
gstreamer = "0.23"
gstreamer-webrtc = "0.23"
gstreamer-sdp = "0.23"
