[package]
name = "yuanchat-desktop"
version = "0.1.0"
description = "元聊 YuanChat — 企业级即时通讯桌面端"
authors = ["元渊"]
license = "MIT"
repository = "https://github.com/liaojie1314/yuanchat"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-os = "2"
time = ">=0.3.35, <0.3.37"

# 自动更新：updater 用 minisign 密钥对签名（自签免费，与 macOS/Windows
# OS 层代码签名相互独立）。移动端不支持 updater，故按 target 分组引入。
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# 条码扫描：仅移动端有摄像头与原生扫码实现，桌面端不编译进去。
[target."cfg(any(target_os = \"android\", target_os = \"ios\"))".dependencies]
tauri-plugin-barcode-scanner = "2"

# WebKitGTK 默认不给 media-stream，也不会弹授权框，语音消息要靠它开权限。
# 版本与 tauri 自身依赖的一致，保证拿到的是同一个 WebView 类型
[target."cfg(target_os = \"linux\")".dependencies]
webkit2gtk = { version = "2", features = ["v2_40"] }
